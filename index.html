<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Within the Forest</title>
<style>
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --appH: 100vh;
  --beige-bg: #e9e5d3;
  --text-dark: #2d4035;
  --panel-bg: rgba(60, 82, 69, 0.85);
  --margin-safe: 20px;
}

html, body {
  margin: 0; padding: 0; background: var(--beige-bg);
  font-family: "ABC Maxi Round", sans-serif;
  overflow: hidden; height: var(--appH);
  /* Verhindert horizontales Scrollen auf Desktops */
  display: flex; justify-content: center;
}

/* ─── Hintergrund & Desktop-Ausblendung ─── */
#stage-container {
  position: fixed; 
  width: 100%; 
  max-width: 480px; /* Fixiert die Breite für Desktop, bleibt mobil flexibel */
  height: var(--appH);
  z-index: 0;
  background: var(--beige-bg);
  overflow: hidden;
}

#bg-image {
  position: absolute; inset: 0;
  background: url("00_Summer%20Forest.png") center center / cover no-repeat;
  transition: background-image 0.8s ease;
}

/* Lösung für iPhone: Verlauf als Overlay statt CSS-Maske */
.fade-overlay {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: linear-gradient(to bottom, 
    var(--beige-bg) 0%, 
    transparent 12%, 
    transparent 88%, 
    var(--beige-bg) 100%);
}

#bg-texture {
  position: absolute; inset: 0; z-index: 2;
  background: url("Background-Texture-web.png") center center / cover repeat;
  mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
}

/* ─── UI Layout (Mobile Optimized) ─── */
.app { 
  position: relative; z-index: 10; 
  width: 100%; max-width: 480px; 
  height: var(--appH); 
  display: flex; flex-direction: column;
}

.content-wrap {
  height: 100%;
  display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 30px) var(--margin-safe) calc(env(safe-area-inset-bottom) + 40px);
  box-sizing: border-box;
}

/* ─── Header ─── */
.header { text-align: left; position: relative; margin-bottom: 5px; }
.tag { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--text-dark); }
.h1 { font-size: 48px; margin: 0; line-height: 0.9; font-weight: 900; color: var(--text-dark); }

/* Baumringe oben (Fix für Pfad) */
.header-rings {
  position: absolute; top: -10px; right: -20px;
  width: 140px; height: auto; opacity: 0.7; pointer-events: none;
}

/* ─── Buttons: Luftig & Klein ─── */
.tabs-float {
  display: flex; flex-wrap: wrap; justify-content: flex-start;
  gap: 8px; margin-top: auto; margin-bottom: 25px;
}
.tab {
  /* Keine Kontur für "luftigen" Look */
  border: none; 
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--text-dark);
  padding: 8px 16px; /* Etwas kleiner */
  border-radius: 40px;
  text-decoration: none; font-size: 14px; font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* Dezenter Schatten statt Rand */
  transition: all 0.3s ease;
}
.tab.active { background: var(--text-dark); color: #fff; transform: scale(0.96); }

/* ─── Player Card mit Hintergrund-Ringen ─── */
.player-card {
  width: 100%;
  background-color: var(--panel-bg);
  /* Baumringe im Player-Hintergrund integriert */
  background-image: url("Baumstamm_freigestellt_beige.png");
  background-position: 110% 50%; /* Leicht nach rechts versetzt */
  background-repeat: no-repeat;
  background-size: 220px; /* Größe der Ringe im Player */
  background-blend-mode: soft-light; /* Macht die Ringe ganz dezent */
  
  backdrop-filter: blur(25px) saturate(180%); -webkit-backdrop-filter: blur(25px);
  border-radius: 30px; padding: 25px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  box-sizing: border-box;
  position: relative; overflow: hidden;
}

.player-info h2 { margin: 0; font-size: 22px; font-weight: 800; }
.player-info p { margin: 2px 0 0; font-size: 13px; opacity: 0.8; }

/* Zeit-Anzeige mit richtiger Schriftart */
.time-label { 
  display: inline-block; margin-top: 10px; 
  font-family: "ABC Maxi Round", sans-serif; /* Korrektur der Schriftart */
  font-size: 14px; font-weight: 500;
}

.play-btn {
  width: 65px; height: 65px; border-radius: 50%; border: none;
  background: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 5;
}
.play-btn svg { width: 28px; height: 28px; fill: #3c5245; }

</style>
</head>
<body>

<div id="stage-container">
  <div id="bg-image"></div>
  <div class="fade-overlay"></div>
  <div id="bg-texture"></div>
</div>

<div class="app">
  <div class="content-wrap">
    
    <header class="header">
      <div class="tag">Sound · Perception · Emotion</div>
      <h1 class="h1">DER WALD</h1>
      <img src="ahorngruen.png" class="header-rings" alt="">
    </header>

    <div class="tabs-float" id="tabs"></div>

    <section class="player-card">
      <div class="player-info">
        <h2 id="track-title">Wald im Sommer</h2>
        <p>Kopfhörer empfohlen</p>
        <span class="time-label" id="track-duration">--:-- min</span>
      </div>
      <button class="play-btn" id="play-trigger">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>
    </section>

  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script>
const TRACK_DATA = {
  summer:  { file: "Forest at Summer.mp3", title: "Wald im Sommer", bg: "00_Summer%20Forest.png" },
  winter:  { file: "Forest at Night.mp3", title: "Winter Wald", bg: "00_Night_Forest.png" },
  spring:  { file: "Forest in the Rain.mp3", title: "Frühlings Wald", bg: "00_Summer%20Forest.png" },
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Wald bei Gewitter", bg: "00_Night_Forest.png" },
  autumn:  { file: "Forest at Summer.mp3", title: "Herbst Wald", bg: "00_Summer%20Forest.png" },
  night:   { file: "Forest at Night.mp3", title: "Nacht Wald", bg: "00_Night_Forest.png" },
  rain:    { file: "Forest in the Rain.mp3", title: "Wald bei Regen", bg: "00_Summer%20Forest.png" },
  city:    { file: "Cityscape.mp3", title: "Der Baum in der Stadt", bg: "00_Cityscape.png" }
};

const tabsContainer = document.getElementById('tabs');
const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-trigger');
const playIcon = document.getElementById('play-icon');
const bgImage = document.getElementById('bg-image');
const timeLabel = document.getElementById('track-duration');

function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00 min";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')} min`;
}

audio.onloadedmetadata = () => {
  timeLabel.textContent = formatTime(audio.duration);
};

function updateUI(key) {
  const track = TRACK_DATA[key];
  document.getElementById('track-title').textContent = track.title;
  bgImage.style.backgroundImage = `url("${track.bg}")`;
  renderTabs(key);
}

function renderTabs(activeKey) {
  tabsContainer.innerHTML = '';
  const order = ['summer', 'winter', 'spring', 'thunder', 'autumn', 'night', 'rain', 'city'];
  order.forEach(key => {
    const btn = document.createElement('a');
    btn.href = "#";
    btn.className = 'tab' + (key === activeKey ? ' active' : '');
    btn.textContent = TRACK_DATA[key].title;
    btn.onclick = (e) => {
      e.preventDefault();
      audio.src = TRACK_DATA[key].file;
      updateUI(key);
      audio.play();
      playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
    };
    tabsContainer.appendChild(btn);
  });
}

playBtn.onclick = () => {
  if(audio.paused) {
    audio.play();
    playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
  } else {
    audio.pause();
    playIcon.setAttribute('d', 'M8 5v14l11-7z');
  }
};

updateUI('summer');
audio.src = TRACK_DATA.summer.file;
</script>

</body>
</html>
