<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Within the Forest</title>
<style>
@font-face{
  font-family:"ABC Maxi Round";
  src:url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight:100 900; font-style:normal; font-display:swap;
}

/* ─── Design Tokens ─────────────────────────────────────────────────────────── */
:root{
  --appH: 100vh;
  --text: rgba(255,255,255,.98);
  --sub:  rgba(255,255,255,.72);
  --vig-top:.90;
  --vig-bot:.92;
  --panelAlpha:.60;
  --panelTint:#8aa1b5;
  --bgFilter:none;
  --chipBg:#202226;
  --chipBorder: rgba(255,255,255,.18);
  --accent:#b8d38f;
  --frameW: min(92vw, 820px);
}

html,body{
  margin:0; padding:0; background:#000; color:var(--text);
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
  font-family:"ABC Maxi Round",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Helvetica,Arial,sans-serif;
}

/* ─── Background Stage ──────────────────────────────────────────────────────── */
#stage{
  position:fixed; inset:0; height:var(--appH); z-index:0;
  background: url("00_Summer Forest.png") center center / cover no-repeat;
  transition: background-image .3s ease, filter .3s ease;
  filter: var(--bgFilter, none);
}
#stage::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,var(--vig-top)) 0%,
      rgba(0,0,0,0) 26%,
      rgba(0,0,0,0) 74%,
      rgba(0,0,0,var(--vig-bot)) 100%);
}

/* Effektebene (Regen/Blitz) */
#fx{ position:fixed; inset:0; height:var(--appH); z-index:1; pointer-events:none; }
#fx.flash{
  animation:flash .35s ease-out;
  background:
    radial-gradient(1200px 800px at 60% 20%, rgba(255,255,255,.8), rgba(255,255,255,0) 60%),
    radial-gradient(900px 600px at 70% 30%, rgba(255,234,160,.45), rgba(255,255,255,0) 60%);
}
@keyframes flash{ 0%{opacity:0} 15%{opacity:1} 100%{opacity:0} }

@media (min-aspect-ratio: 4/3){
  #stage{ background-size:contain; background-color:#000; }
}

/* ─── UI Layout ─────────────────────────────────────────────────────────────── */
.app{ position:fixed; inset:0; height:var(--appH); z-index:2; }
.wrap{
  position:relative; width:100%; height:100%;
  padding:calc(env(safe-area-inset-top)+22px) 14px calc(env(safe-area-inset-bottom)+18px);
}

.frame{
  width:var(--frameW);
  margin:0 auto;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:16px;
  height:100%;
}

/* ─── Header ───────────────────────────────────────────────────────────────── */
.header{
  margin-top:clamp(32px, 11vh, 120px);
  margin-left:6px;
}
.h1{
  margin:0 0 .4rem 0; line-height:.92; text-transform:uppercase;
  letter-spacing:.02em; font-weight:800; font-size:clamp(30px,7.6vw,58px);
}
.tag{ color:var(--sub); font-size:clamp(13px,3.4vw,16px); letter-spacing:.08em; }

/* ─── Deck ─────────────────────────────────────────────────────────────────── */
.deck{
  align-self:end;
  display:grid; gap:12px;
}

/* ─── Glass Panels ─────────────────────────────────────────────────────────── */
.glass{
  position: relative;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  background: rgba(10,12,16,var(--panelAlpha));
  border:1px solid rgba(255,255,255,.16);
  border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.40);
}
.glass::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: linear-gradient(135deg,
              color-mix(in srgb, var(--panelTint) 32%, transparent) 0%,
              color-mix(in srgb, var(--panelTint) 10%, transparent) 60%,
              transparent 100%);
  opacity:.55;
}

/* ─── Player ───────────────────────────────────────────────────────────────── */
.player{ padding:18px clamp(16px,4vw,28px); display:flex; align-items:center; justify-content:space-between; gap:24px; position:relative; z-index:1;}
.title{ margin:0; font-weight:800; font-size:clamp(18px,4.8vw,28px); }
.sub{ margin:.25rem 0 0; color:var(--sub); font-size:clamp(12px,3.2vw,14px); }
.play{
  display:grid; place-items:center; width:clamp(56px,14vw,84px); aspect-ratio:1; border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
  box-shadow:inset 0 0 18px rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.45);
  cursor:pointer; transition:.2s; -webkit-tap-highlight-color:transparent;
}
.play:disabled{ opacity:.45; cursor:not-allowed; }
.play:hover{ transform:scale(1.04) }
.play svg{ width:40%; height:40% } .play path{ fill:var(--accent) }

/* ─── Tabs ─────────────────────────────────────────────────────────────────── */
.tabs{ padding:14px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; position:relative; z-index:1;}
.tab{
  border:1px solid var(--chipBorder);
  background:var(--chipBg);
  color:#f1f1f1;
  font-size:15px; padding:10px 14px; border-radius:999px; text-decoration:none; transition:.2s;
}
.tab:hover{ opacity:.9 }
.tab.active{ border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent) inset }

/* ─── Rain ─────────────────────────────────────────────────────────────────── */
.raindrop{
  position:fixed; top:-12vh; width:1.6px; height:36px;
  background:rgba(255,255,255,0.12); border-radius:2px;
  animation:fall linear forwards; z-index:1; pointer-events:none;
}
@keyframes fall{ to{ transform:translateY(112vh); opacity:0 } }
</style>
</head>
<body>

<div id="stage" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>

<div class="app">
  <div class="wrap">
    <div class="frame">
      <header class="header">
        <h1 class="h1">WITHIN<br>THE FOREST</h1>
        <div class="tag">Sound · Perception · Emotion</div>
      </header>

      <div></div>

      <section class="deck">
        <div class="glass player">
          <div>
            <h2 class="title" id="title">Forest in Summer</h2>
            <p class="sub" id="subtxt">Headphones recommended</p>
          </div>
          <button class="play" id="play" aria-label="Play/Pause">
            <svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg>
          </button>
        </div>
        <nav class="glass tabs" id="tabs"></nav>
      </section>
    </div>
  </div>
</div>

<audio id="aud" preload="auto"></audio>

<script>
/* ---------- Height + Frame Scaling ---------- */
const PORTRAIT_AR = 2/3;
function setAppH(){
  const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--appH', Math.round(h) + 'px');
  const isDesktop = window.matchMedia('(min-aspect-ratio: 4/3)').matches;
  if(isDesktop){
    const picW = h * PORTRAIT_AR;
    const frameW = Math.min(picW, window.innerWidth * 0.92);
    document.documentElement.style.setProperty('--frameW', frameW + 'px');
  }else{
    document.documentElement.style.setProperty('--frameW', 'min(92vw, 820px)');
  }
}
function bump(){ setAppH(); setTimeout(setAppH,80); setTimeout(setAppH,300); }
bump(); addEventListener('resize', bump, {passive:true}); addEventListener('orientationchange', bump);

/* ---------- Assets ---------- */
const IMAGES = {
  summer: "00_Summer Forest.png",
  night:  "00_Night_Forest.png",
  city:   "00_Cityscape.png"
};
const TRACKS = {
  summer:    { file:"Forest at Summer.mp3",       title:"Forest in Summer",            bg:"summer", mood:"warm"  },
  rain:      { file:"Forest in the Rain.mp3",     title:"Forest in the Rain",          bg:"summer", mood:"rain"  },
  thunder:   { file:"Forest at Thunderstorm.mp3", title:"Forest during a Thunderstorm",bg:"night",  mood:"storm" },
  night:     { file:"Forest at Night.mp3",        title:"Forest at Night",             bg:"night",  mood:"cool"  },
  cityscape: { file:"Cityscape.mp3",              title:"Cityscape",                   bg:"city",   mood:"city"  }
};

const stage = document.getElementById('stage');
const fx    = document.getElementById('fx');
const aud   = document.getElementById('aud');
const btn   = document.getElementById('play');
const icon  = document.getElementById('icon');
const titleEl = document.getElementById('title');
const tabsEl  = document.getElementById('tabs');

function setIcon(p){ icon.setAttribute('d', p ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z'); }
function disablePlay(dis){ btn.disabled = !!dis; if(dis) setIcon(false); }

/* ---------- Rain ---------- */
let raining=false, rainT=null;
function clearRain(){ document.querySelectorAll('.raindrop').forEach(e=>e.remove()); raining=false; clearTimeout(rainT); }
function rain(){ if(!raining) return;
  const n = innerWidth<768?22:38;
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='raindrop';
    d.style.left=(Math.random()*100)+'vw';
    d.style.height=(24+Math.random()*54)+'px';
    d.style.opacity=(0.06+Math.random()*0.16).toFixed(2);
    d.style.animationDuration=(innerWidth<768?(2.0+Math.random()*1.4):(1.0+Math.random()*1.4))+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 3000);
  }
  rainT=setTimeout(rain, 1000);
}

/* ---------- Lightning ---------- */
let storm=false, flashT=null;
function clearFlash(){ clearTimeout(flashT); fx.classList.remove('flash'); storm=false; }
function scheduleFlash(){
  if(!storm) return;
  const wait = 1800 + Math.random()*5000;
  flashT = setTimeout(()=>{
    fx.classList.add('flash');
    setTimeout(()=>fx.classList.remove('flash'), 360);
    scheduleFlash();
  }, wait);
}

/* ---------- Mood Styling ---------- */
function setBackground(key){ stage.style.backgroundImage = `url("${IMAGES[key]}")`; }

function grade(mood){
  let vigT=.90, vigB=.92;
  let panelAlpha=.60;
  let panelTint ='#8aa1b5';
  let bgFilter  ='none';

  clearRain(); clearFlash();

  if(mood==='warm'){
    vigT=.92; vigB=.95;
    panelAlpha=.64;
    panelTint='#d7c28a';
    bgFilter='saturate(1.05) brightness(1.04)';
  }
  else if(mood==='rain'){
    vigT=.965; vigB=.985;
    panelAlpha=.70;
    panelTint='#6aa09a';
    bgFilter='saturate(0.9) brightness(0.80) contrast(1.06) hue-rotate(-6deg)';
    raining=true; rain();
  }
  else if(mood==='storm'){
    vigT=.94; vigB=.965;
    panelAlpha=.72;
    panelTint='#8190b5';
    bgFilter='saturate(0.85) brightness(0.78) contrast(1.10)';
    storm=true; scheduleFlash();
  }
  else if(mood==='city'){
    vigT=.95; vigB=.965;
    panelAlpha=.72;
    panelTint='#6f90a2';
    bgFilter='saturate(0.95) brightness(0.92) contrast(1.05)';
  }
  else {
    vigT=.93; vigB=.95;
    panelAlpha=.66;
    panelTint='#7e89a7';
    bgFilter='saturate(0.9) brightness(0.90) contrast(1.04)';
  }

  document.documentElement.style.setProperty('--vig-top', vigT);
  document.documentElement.style.setProperty('--vig-bot', vigB);
  document.documentElement.style.setProperty('--panelAlpha', panelAlpha);
  document.documentElement.style.setProperty('--panelTint', panelTint);
  document.documentElement.style.setProperty('--bgFilter', bgFilter);
}

/* ---------- Tabs ---------- */
function buildTabs(active){
  const order=['summer','rain','thunder','night','cityscape'];
  tabsEl.innerHTML='';
  order.forEach(k=>{
    const a=document.createElement('a');
    a.href=`?track=${k}`; a.className='tab'+(k===active?' active':''); a.dataset.key=k;
    a.textContent=TRACKS[k].title;
    a.addEventListener('click',e=>{e.preventDefault(); history.replaceState(null,'',`?track=${k}`); setTrack(k,true);});
    tabsEl.appendChild(a);
  });
}

/* ---------- Track Switching ---------- */
function setTrack(key, autoplay=false){
  const t=TRACKS[key]; if(!t) return;
  titleEl.textContent=t.title;
  setBackground(t.bg);
  grade(t.mood);

  if(t.file){ aud.src=encodeURI(t.file); disablePlay(false); }
  else { aud.removeAttribute('src'); disablePlay(true); }

  [...tabsEl.children].forEach(a=>a.classList.toggle('active', a.dataset.key===key));
  setIcon(false);
  if(autoplay && t.file){ aud.play().then(()=>setIcon(true)).catch(()=>{}); }
}

/* ---------- Controls ---------- */
btn.addEventListener('click', ()=>{
  if(btn.disabled) return;
  if(aud.paused){ aud.play().then(()=>setIcon(true)).catch(()=>{}); }
  else { aud.pause(); setIcon(false); }
});
aud.addEventListener('pause', ()=>setIcon(false));
aud.addEventListener('play',  ()=>setIcon(true));

/* ---------- Init ---------- */
const params=new URLSearchParams(location.search);
const start=params.get('track')||'summer';
buildTabs(start);
setTrack(start,false);
</script>
</body>
</html>
