<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Within the Forest</title>
<style>
/* ------ Font ------ */
@font-face{
  font-family:"ABC Maxi Round";
  src:url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight:100 900; font-style:normal; font-display:swap;
}

/* ------ Design Tokens ------ */
:root{
  --appH: 100vh;
  --text: rgba(255,255,255,.98);
  --sub:  rgba(255,255,255,.72);
  --glass: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.18);
  --accent:#b8d38f;
  --vig-top:.86;
  --vig-bot:.88;
}

/* ------ Base ------ */
html,body{
  margin:0; padding:0; background:#000; color:var(--text);
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
  font-family:"ABC Maxi Round",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Helvetica,Arial,sans-serif;
}

/* ------ Background Stage ------ */
#stage{
  position:fixed; inset:0; height:var(--appH); z-index:0;
  background: url("00_Summer Forest.png") center center / cover no-repeat;
  transition: background-image .3s ease;
}
#stage::after{ /* kräftige Vignette gegen schwarze Balken */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    linear-gradient(to bottom,
      rgba(0,0,0,var(--vig-top)) 0%,
      rgba(0,0,0,0) 26%,
      rgba(0,0,0,0) 74%,
      rgba(0,0,0,var(--vig-bot)) 100%);
}
/* Desktop: Portrait nicht strecken (Letterbox) */
@media (min-aspect-ratio: 4/3){
  #stage{ background-size:contain; background-color:#000; }
}

/* ------ App-Layer ------ */
.app{ position:fixed; inset:0; height:var(--appH); z-index:2; }
.wrap{ position:relative; width:100%; height:100%;
  padding:calc(env(safe-area-inset-top)+18px) 18px calc(env(safe-area-inset-bottom)+18px);
}

/* Header oben links */
.header{ max-width:min(92vw,820px); margin-left:4px; }
.h1{ margin:0 0 .4rem 0; line-height:.9; text-transform:uppercase;
  letter-spacing:.02em; font-weight:800; font-size:clamp(28px,7vw,56px); }
.tag{ color:var(--sub); font-size:clamp(13px,3.4vw,16px); letter-spacing:.08em; }

/* Controls unten fest */
.deck{
  position:absolute; left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 18px);
  transform:translateX(-50%);
  width:min(92vw, 920px);
  display:grid; gap:14px;
}

/* Glas */
.glass{
  backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  background:var(--glass); border:1px solid var(--stroke); border-radius:22px;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

/* Player */
.player{ padding:18px clamp(16px,4vw,28px); display:flex; align-items:center; justify-content:space-between; gap:24px; }
.title{ margin:0; font-weight:800; font-size:clamp(18px,4.8vw,28px); }
.sub{ margin:.25rem 0 0; color:var(--sub); font-size:clamp(12px,3.2vw,14px); }
.play{
  display:grid; place-items:center; width:clamp(56px,14vw,84px); aspect-ratio:1; border-radius:50%;
  border:1px solid var(--stroke);
  background:linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  box-shadow:inset 0 0 18px rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.45);
  cursor:pointer; transition:.2s; -webkit-tap-highlight-color:transparent;
}
.play:disabled{ opacity:.45; cursor:not-allowed; }
.play:hover{ transform:scale(1.04) }
.play svg{ width:40%; height:40% } .play path{ fill:var(--accent) }

/* Tabs */
.tabs{ padding:14px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.tab{
  border:1px solid var(--stroke); background:#202022; color:#eee;
  font-size:15px; padding:10px 14px; border-radius:999px; text-decoration:none; transition:.2s;
}
.tab:hover{ opacity:.87 }
.tab.active{ color:var(--text); border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent) inset }

/* Regen */
.raindrop{
  position:fixed; top:-12vh; width:1.6px; height:36px;
  background:rgba(255,255,255,0.12); border-radius:2px;
  animation:fall linear forwards; z-index:1; pointer-events:none;
}
@keyframes fall{ to{ transform:translateY(112vh); opacity:0 } }
</style>
</head>
<body>

<!-- Background -->
<div id="stage" aria-hidden="true"></div>

<!-- UI -->
<div class="app">
  <div class="wrap">

    <header class="header">
      <h1 class="h1">WITHIN<br>THE FOREST</h1>
      <div class="tag">Sound · Perception · Emotion</div>
    </header>

    <section class="deck">
      <div class="glass player">
        <div>
          <h2 class="title" id="title">Forest in Summer</h2>
          <p class="sub" id="subtxt">Headphones recommended</p>
        </div>
        <button class="play" id="play" aria-label="Play/Pause">
          <svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <nav class="glass tabs" id="tabs"></nav>
    </section>

  </div>
</div>

<audio id="aud" preload="auto"></audio>

<script>
/* --------------- Height fix (iOS) --------------- */
function setAppH(){
  const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--appH', Math.round(h) + 'px');
}
function bump(){ setAppH(); setTimeout(setAppH,80); setTimeout(setAppH,300); }
bump(); addEventListener('resize', bump, {passive:true}); addEventListener('orientationchange', bump);

/* --------------- Assets + Tracks --------------- */
const IMAGES = {
  summer: "00_Summer Forest.png",
  night:  "00_Night_Forest.png",
  city:   "00_Cityscape.png"
};
const TRACKS = {
  summer:    { file:"Forest at Summer.mp3",       title:"Forest in Summer",            bg:"summer", mood:"warm"  },
  rain:      { file:"Forest in the Rain.mp3",     title:"Forest in the Rain",          bg:"summer", mood:"rain"  },
  thunder:   { file:"Forest at Thunderstorm.mp3", title:"Forest during a Thunderstorm",bg:"night",  mood:"storm" },
  night:     { file:"Forest at Night.mp3",        title:"Forest at Night",             bg:"night",  mood:"cool"  },
  cityscape: { file:"Cityscape.mp3",              title:"Cityscape",                   bg:"city",   mood:"city"  }
};

const stage = document.getElementById('stage');
const aud   = document.getElementById('aud');
const btn   = document.getElementById('play');
const icon  = document.getElementById('icon');
const titleEl = document.getElementById('title');
const tabsEl  = document.getElementById('tabs');

function setIcon(p){ icon.setAttribute('d', p ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z'); }
function disablePlay(dis){ btn.disabled = !!dis; if(dis) setIcon(false); }

/* Regen */
let raining=false, rainT=null;
function clearRain(){ document.querySelectorAll('.raindrop').forEach(e=>e.remove()); raining=false; clearTimeout(rainT); }
function rain(){ if(!raining) return;
  const n = innerWidth<768?22:38;
  for(let i=0;i<n;i++){
    const d=document.createElement('div'); d.className='raindrop';
    d.style.left=(Math.random()*100)+'vw';
    d.style.height=(24+Math.random()*54)+'px';
    d.style.opacity=(0.06+Math.random()*0.16).toFixed(2);
    d.style.animationDuration=(innerWidth<768?(2.0+Math.random()*1.4):(1.0+Math.random()*1.4))+'s';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 3000);
  }
  rainT=setTimeout(rain, 1000);
}

/* Hintergrund setzen */
function setBackground(key){ stage.style.backgroundImage = `url("${IMAGES[key]}")`; }
/* Grading/Vignette pro Stimmung */
function grade(mood){
  clearRain();
  let t=.86, b=.88;
  if(mood==='warm'){ t=.90; b=.92; }          // hell -> stärker
  if(mood==='rain'){ t=.92; b=.94; raining=true; rain(); } // Regen abdunkeln
  if(mood==='storm'){ t=.90; b=.92; }         // Gewitter auf Night
  if(mood==='city'){  t=.94; b=.95; }         // City sehr dunkel
  document.documentElement.style.setProperty('--vig-top', t);
  document.documentElement.style.setProperty('--vig-bot', b);
}

/* Tabs bauen */
function buildTabs(active){
  const order=['summer','rain','thunder','night','cityscape'];
  tabsEl.innerHTML='';
  order.forEach(k=>{
    const a=document.createElement('a');
    a.href=`?track=${k}`; a.className='tab'+(k===active?' active':''); a.dataset.key=k;
    a.textContent=TRACKS[k].title;
    a.addEventListener('click',e=>{e.preventDefault(); history.replaceState(null,'',`?track=${k}`); setTrack(k,true);});
    tabsEl.appendChild(a);
  });
}

/* Track setzen */
function setTrack(key, autoplay=false){
  const t=TRACKS[key]; if(!t) return;
  titleEl.textContent=t.title;

  setBackground(t.bg);
  grade(t.mood);

  if(t.file){ aud.src=encodeURI(t.file); disablePlay(false); }
  else { aud.removeAttribute('src'); disablePlay(true); }

  [...tabsEl.children].forEach(a=>a.classList.toggle('active', a.dataset.key===key));
  setIcon(false);
  if(autoplay && t.file){ aud.play().then(()=>setIcon(true)).catch(()=>{}); }
}

/* Play/Pause */
btn.addEventListener('click', ()=>{
  if(btn.disabled) return;
  if(aud.paused){ aud.play().then(()=>setIcon(true)).catch(()=>{}); }
  else { aud.pause(); setIcon(false); }
});
aud.addEventListener('pause', ()=>setIcon(false));
aud.addEventListener('play',  ()=>setIcon(true));

/* Init */
const params=new URLSearchParams(location.search);
const start=params.get('track')||'summer';
buildTabs(start);
setTrack(start,false);
</script>
</body>
</html>
