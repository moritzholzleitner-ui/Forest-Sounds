<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Within the Forest</title>
<style>
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --appH: 100vh;
  --beige-bg: #e9e5d3;
  --text-dark: #2d4035;
  --panel-bg: rgba(60, 82, 69, 0.8);
  --margin-safe: 24px;
}

html, body {
  margin: 0; padding: 0; background: var(--beige-bg);
  font-family: "ABC Maxi Round", sans-serif;
  overflow: hidden; height: var(--appH);
}

/* ─── Hintergrund & Weicher Fade ─── */
#stage-container {
  position: fixed; inset: 0; z-index: 0;
  background: var(--beige-bg);
}

#bg-image {
  position: absolute; inset: 0;
  background: url("00_Summer Forest.png") center center / cover no-repeat;
  transition: background-image 0.8s ease-in-out;
  /* Verfeinerter Fade mit mehreren Stops für weichen Übergang */
  -webkit-mask-image: linear-gradient(to bottom, 
    transparent 0%, 
    rgba(0,0,0,0.2) 5%, 
    black 15%, 
    black 82%, 
    rgba(0,0,0,0.2) 95%, 
    transparent 100%);
  mask-image: linear-gradient(to bottom, 
    transparent 0%, 
    rgba(0,0,0,0.2) 5%, 
    black 15%, 
    black 82%, 
    rgba(0,0,0,0.2) 95%, 
    transparent 100%);
}

#bg-texture {
  position: absolute; inset: 0;
  background: url("Background-Texture-web.png") center center / cover repeat;
  mix-blend-mode: multiply;
  opacity: 0.45;
  pointer-events: none;
}

/* ─── UI Layout ─── */
.app { position: relative; z-index: 2; height: var(--appH); display: flex; flex-direction: column; align-items: center; }

.content-wrap {
  width: 100%;
  max-width: 500px;
  height: 100%;
  display: flex;
  flex-direction: column;
  /* Erhöhter Abstand unten für die Player-Box */
  padding: calc(env(safe-area-inset-top) + 40px) var(--margin-safe) calc(env(safe-area-inset-bottom) + 50px);
  box-sizing: border-box;
}

/* ─── Header ─── */
.header { text-align: left; position: relative; margin-bottom: 10px; }
.tag { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; color: var(--text-dark); }
.h1 { font-size: clamp(42px, 12vw, 64px); margin: 0; line-height: 0.9; font-weight: 900; color: var(--text-dark); }

.tree-rings {
  position: absolute;
  top: 0px; right: -15px;
  width: 135px; height: auto;
  opacity: 0.8;
  pointer-events: none;
}

/* ─── Schwebende Buttons (Linksbündig) ─── */
.tabs-float {
  display: flex; 
  flex-wrap: wrap; 
  justify-content: flex-start; /* Linksbündig */
  gap: 10px;
  margin-top: auto; 
  margin-bottom: 35px; /* Abstand zum Player */
}
.tab {
  border: 1.5px solid var(--text-dark);
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text-dark);
  padding: 10px 20px; border-radius: 40px;
  text-decoration: none; font-size: 15px; font-weight: 600;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.tab.active { background: var(--text-dark); color: #fff; transform: translateY(-2px); }

/* ─── Player Card ─── */
.player-card {
  width: 100%;
  background: var(--panel-bg);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 32px; 
  padding: 28px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; 
  box-shadow: 0 20px 45px rgba(0,0,0,0.18);
  box-sizing: border-box;
}
.player-info h2 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.player-info p { margin: 4px 0 0; font-size: 14px; opacity: 0.85; }
.time-label { display: inline-block; margin-top: 12px; font-family: monospace; font-size: 15px; opacity: 0.9; }

.play-btn {
  width: 70px; height: 70px; border-radius: 50%; border: none;
  background: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.play-btn svg { width: 32px; height: 32px; fill: #3c5245; }

</style>
</head>
<body>

<div id="stage-container">
  <div id="bg-image"></div>
  <div id="bg-texture"></div>
</div>

<div class="app">
  <div class="content-wrap">
    
    <header class="header">
      <div class="tag">Sound · Perception · Emotion</div>
      <h1 class="h1">DER WALD</h1>
      <img src="ahorngruen.png" class="tree-rings" alt="">
    </header>

    <div class="tabs-float" id="tabs"></div>

    <section class="player-card">
      <div class="player-info">
        <h2 id="track-title">Wald im Sommer</h2>
        <p>Kopfhörer empfohlen</p>
        <span class="time-label" id="track-duration">--:--</span>
      </div>
      <button class="play-btn" id="play-trigger">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>
    </section>

  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script>
const TRACK_DATA = {
  summer:  { file: "Forest at Summer.mp3", title: "Wald im Sommer", bg: "00_Summer Forest.png" },
  winter:  { file: "Forest at Night.mp3", title: "Winter Wald", bg: "00_Night_Forest.png" },
  spring:  { file: "Forest in the Rain.mp3", title: "Frühlings Wald", bg: "00_Summer Forest.png" },
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Wald bei Gewitter", bg: "00_Night_Forest.png" },
  autumn:  { file: "Forest at Summer.mp3", title: "Herbst Wald", bg: "00_Summer Forest.png" },
  night:   { file: "Forest at Night.mp3", title: "Nacht Wald", bg: "00_Night_Forest.png" },
  rain:    { file: "Forest in the Rain.mp3", title: "Wald bei Regen", bg: "00_Summer Forest.png" },
  city:    { file: "Cityscape.mp3", title: "Der Baum in der Stadt", bg: "00_Cityscape.png" }
};

const tabsContainer = document.getElementById('tabs');
const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-trigger');
const playIcon = document.getElementById('play-icon');
const bgImage = document.getElementById('bg-image');
const timeLabel = document.getElementById('track-duration');

// Funktion zur Formatierung der Zeit
function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00 min";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')} min`;
}

// Echtzeit-Update der Dauer, sobald die Datei geladen ist
audio.onloadedmetadata = () => {
  timeLabel.textContent = formatTime(audio.duration);
};

function updateUI(key) {
  const track = TRACK_DATA[key];
  document.getElementById('track-title').textContent = track.title;
  bgImage.style.backgroundImage = `url("${track.bg}")`;
  renderTabs(key);
}

function renderTabs(activeKey) {
  tabsContainer.innerHTML = '';
  // "summer" ist jetzt explizit in der Liste enthalten
  const order = ['summer', 'winter', 'spring', 'thunder', 'autumn', 'night', 'rain', 'city'];
  
  order.forEach(key => {
    const btn = document.createElement('a');
    btn.href = "#";
    btn.className = 'tab' + (key === activeKey ? ' active' : '');
    btn.textContent = TRACK_DATA[key].title;
    btn.onclick = (e) => {
      e.preventDefault();
      if(activeKey === key) return;
      audio.src = TRACK_DATA[key].file;
      updateUI(key);
      audio.play();
      playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
    };
    tabsContainer.appendChild(btn);
  });
}

playBtn.onclick = () => {
  if(audio.paused) {
    audio.play();
    playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
  } else {
    audio.pause();
    playIcon.setAttribute('d', 'M8 5v14l11-7z');
  }
};

// Initialisierung
updateUI('summer');
audio.src = TRACK_DATA.summer.file;
</script>

</body>
</html>
