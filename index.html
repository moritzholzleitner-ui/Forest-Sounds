<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Within the Forest</title>
<style>
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --appH: 100vh;
  --bg-base: #e9e5d3; 
  --text-main: #2d4035; /* Das gewünschte Dunkelgrün */
  --glass-color: rgba(255, 255, 255, 0.45);
  --player-tint: rgba(45, 64, 53, 0.85); /* Player-Grün mit Transparenz */
  --progress-green: #2d4035; /* Fortschrittsbalken in Headline-Farbe */
}

html, body {
  margin: 0; padding: 0; background: var(--bg-base);
  font-family: "ABC Maxi Round", sans-serif;
  overflow: hidden; height: var(--appH);
  display: flex; justify-content: center;
  transition: background-color 0.8s ease-in-out;
}

/* ─── Hintergrund-Container ─── */
#stage-container {
  position: fixed; width: 100%; max-width: 100vh; height: var(--appH);
  z-index: 0; overflow: hidden; background: var(--bg-base);
}

#bg-image {
  position: absolute; inset: 0; background-position: center center;
  background-size: cover; transition: background-image 0.8s ease;
}

.fade-overlay {
  position: absolute; inset: -1px; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 18%, transparent 82%, var(--bg-base) 100%);
  transition: background 0.8s ease;
}

#bg-texture {
  position: absolute; inset: 0; z-index: 2;
  background: url("Background-Texture-web.png") center center / cover repeat;
  mix-blend-mode: multiply; opacity: 0.35; pointer-events: none;
}

/* ─── UI Layout ─── */
.app { 
  position: relative; z-index: 10; width: 100%; max-width: 100vh; 
  height: var(--appH); display: flex; flex-direction: column;
}

.content-wrap {
  height: 100%; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 70px) 24px calc(env(safe-area-inset-bottom) + 85px);
  box-sizing: border-box;
}

/* ─── Header & Baumringe (Multiply) ─── */
.header { text-align: left; position: relative; margin-bottom: 15px; }
.tag { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; color: var(--text-main); }
.h1 { font-size: 50px; margin: 0; line-height: 0.9; font-weight: 900; color: var(--text-main); }

.header-rings { 
  position: absolute; top: -10px; right: -15px; width: 150px; height: auto; 
  mix-blend-mode: multiply; /* Macht weißen Hintergrund transparent */
  opacity: 0.9; pointer-events: none; 
}

/* ─── Schwebende Buttons ─── */
.tabs-float { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 10px; margin-top: auto; margin-bottom: 35px; }
.tab {
  border: none; background: var(--glass-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text-main); padding: 10px 18px; border-radius: 40px;
  text-decoration: none; font-size: 15px; font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: all 0.3s ease;
}
.tab.active { background: var(--text-main); color: #fff; transform: scale(0.97); }

/* ─── Player Card ─── */
.player-card {
  width: 100%; position: relative;
  background: var(--player-tint); backdrop-filter: blur(25px) saturate(140%); -webkit-backdrop-filter: blur(25px);
  border-radius: 35px; padding: 28px 28px 34px 28px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; box-shadow: 0 22px 45px rgba(0,0,0,0.2);
  box-sizing: border-box; overflow: hidden;
}

/* Player Baumringe (Multiply) */
.player-rings-bg {
  position: absolute; inset: 0; 
  background: url("Baumstamm_freigestellt_beige.png") center center / cover no-repeat;
  mix-blend-mode: multiply; /* Entfernt weißen Hintergrund im Player */
  opacity: 0.25; pointer-events: none; z-index: 1;
}

.player-info { position: relative; z-index: 5; }
.player-info h2 { margin: 0; font-size: 24px; font-weight: 800; }
.player-info p { margin: 4px 0 0; font-size: 14px; opacity: 0.85; }
.time-label { display: inline-block; margin-top: 12px; font-size: 15px; font-family: "ABC Maxi Round", sans-serif; }

.play-btn {
  position: relative; z-index: 5;
  width: 68px; height: 68px; border-radius: 50%; border: none;
  background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.play-btn svg { width: 30px; height: 30px; fill: var(--text-main); }

/* ─── Fortschrittsbalken (Dunkelgrün) ─── */
.progress-container {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
  background: rgba(255, 255, 255, 0.1); z-index: 10; cursor: pointer;
}
.progress-bar {
  height: 100%; width: 0%; background: var(--progress-green);
  transition: width 0.1s linear;
}

@media (orientation: landscape) and (max-height: 500px) {
  body::after { content: "Bitte verwende das Hochformat"; position: fixed; inset: 0; background: var(--bg-base); z-index: 1000; display: flex; align-items: center; justify-content: center; font-weight: 900; }
}
</style>
</head>
<body>

<div id="stage-container">
  <div id="bg-image"></div>
  <div class="fade-overlay"></div>
  <div id="bg-texture"></div>
</div>

<div class="app">
  <div class="content-wrap">
    
    <header class="header">
      <div class="tag">Sound · Perception · Emotion</div>
      <h1 class="h1">DER WALD</h1>
      <img src="brett-aquarell-web.png" class="header-rings" alt="">
    </header>

    <div class="tabs-float" id="tabs"></div>

    <section class="player-card">
      <div class="player-rings-bg"></div>
      <div class="player-info">
        <h2 id="track-title">Sommer</h2>
        <p>Kopfhörer empfohlen</p>
        <span class="time-label" id="track-duration">0:00 / --:--</span>
      </div>
      <button class="play-btn" id="play-trigger">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </section>

  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script>
// Neue Files und Themes
const TRACK_DATA = {
  summer:  { file: "Forest at Summer.mp3", title: "Sommer", bg: "03_Sommer.png", theme: "light" },
  winter:  { file: "Forest at Night.mp3", title: "Winter", bg: "01_Winter.png", theme: "dark" },
  spring:  { file: "Forest in the Rain.mp3", title: "Frühling", bg: "02_Frühling.png", theme: "light" },
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Bei Gewitter", bg: "00_Gewitter.png", theme: "dark" },
  autumn:  { file: "Forest at Summer.mp3", title: "Herbst", bg: "04_Herbst.jpg", theme: "light" }, // Beachte .jpg
  night:   { file: "Forest at Night.mp3", title: "Nacht", bg: "00_Nacht.png", theme: "dark" },
  rain:    { file: "Forest in the Rain.mp3", title: "Bei Regen", bg: "00_Regen.png", theme: "light" },
  city:    { file: "Cityscape.mp3", title: "In der Stadt", bg: "%21%3F_Urbanitaet.png", theme: "dark" }
};

const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-trigger');
const playIcon = document.getElementById('play-icon');
const bgImage = document.getElementById('bg-image');
const timeLabel = document.getElementById('track-duration');
const tabsContainer = document.getElementById('tabs');
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-container');

function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateUI(key) {
  const track = TRACK_DATA[key];
  document.getElementById('track-title').textContent = track.title;
  bgImage.style.backgroundImage = `url("${track.bg}")`;

  const isDark = track.theme === "dark";
  const bgColor = isDark ? "#1a1c1a" : "#e9e5d3";
  const textColor = isDark ? "#e9e5d3" : "#2d4035";

  document.documentElement.style.setProperty('--bg-base', bgColor);
  document.documentElement.style.setProperty('--text-main', textColor);
  document.documentElement.style.setProperty('--glass-color', isDark ? "rgba(255, 255, 255, 0.15)" : "rgba(255, 255, 255, 0.45)");
  
  progressBar.style.width = "0%";
  renderTabs(key);
}

function renderTabs(activeKey) {
  tabsContainer.innerHTML = '';
  const order = ['summer', 'winter', 'spring', 'autumn', 'night', 'rain', 'thunder', 'city'];
  order.forEach(key => {
    const btn = document.createElement('a');
    btn.href = "#";
    btn.className = 'tab' + (key === activeKey ? ' active' : '');
    btn.textContent = TRACK_DATA[key].title;
    btn.onclick = (e) => {
      e.preventDefault();
      if (activeKey === key) return;
      audio.src = TRACK_DATA[key].file;
      updateUI(key);
      audio.play();
      playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
    };
    tabsContainer.appendChild(btn);
  });
}

audio.onloadedmetadata = () => {
   timeLabel.textContent = "0:00 / " + formatTime(audio.duration);
};

audio.ontimeupdate = () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${percent}%`;
    timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }
};

progressContainer.onclick = (e) => {
  const rect = progressContainer.getBoundingClientRect();
  const percentage = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percentage * audio.duration;
};

playBtn.onclick = () => {
  if(audio.paused) {
    audio.play();
    playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
  } else {
    audio.pause();
    playIcon.setAttribute('d', 'M8 5v14l11-7z');
  }
};

updateUI('summer');
audio.src = TRACK_DATA.summer.file;
</script>

</body>
</html>
