<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Within the Forest</title>

<style>
:root{
  --overlay: linear-gradient(90deg, rgba(5,20,40,0.70) 0%, rgba(0,0,0,0.30) 40%, rgba(10,30,50,0.70) 100%);
  --text: rgba(255,255,255,.96);
  --sub: rgba(255,255,255,.65);
  --glass: rgba(255,255,255,.06);
  --stroke: rgba(255,255,255,.18);
  --accent:#a7c48c;
  --tab:#2a2a2a;
  --appH: 100vh; /* set by JS */
}

/* Font – ABC Maxi Round (your uploaded TTF) */
@font-face{
  font-family:"ABC Maxi Round";
  src:url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}

/* Base */
html, body{
  margin:0; padding:0; background:#000; color:var(--text);
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Helvetica,Arial,sans-serif;
}

/* Background */
#bg{
  position:fixed; inset:0; width:100%; height:var(--appH); z-index:0;
  background:
    var(--overlay),
    url("00_Summer Forest.png") center center / cover no-repeat;
  filter:saturate(1.05);
  transition: background .6s ease, height .2s ease, filter .4s ease;
}
/* Top/Bottom black edge gradients */
#bg::before,
#bg::after{
  content:"";
  position:absolute;
  left:0; width:100%; height:22vh;
  pointer-events:none;
  z-index:1;
}
#bg::before{
  top:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
}
#bg::after{
  bottom:0;
  background:linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
}

/* Rain */
.raindrop{
  position:fixed; top:-12vh; width:1.6px; height:36px;
  background:rgba(255,255,255,0.12); border-radius:2px;
  animation:fall linear forwards; z-index:0; pointer-events:none;
}
@keyframes fall{ to{ transform:translateY(112vh); opacity:0 } }

/* Lightning flash (thunderstorm) */
.flash{
  position:fixed; inset:0; background:radial-gradient(ellipse at 60% 25%, rgba(255,255,255,.65), rgba(255,255,255,0) 60%);
  mix-blend-mode:screen; opacity:0; pointer-events:none; z-index:0;
  animation:blink .8s ease forwards;
}
@keyframes blink{
  0%{opacity:0}
  10%{opacity:.9}
  40%{opacity:.25}
  100%{opacity:0}
}

/* App layer */
.app{
  position:relative; z-index:2;
  min-height:var(--appH);
  display:flex; align-items:flex-start; justify-content:center;
  padding:calc(env(safe-area-inset-top)+18px) 16px calc(env(safe-area-inset-bottom)+16px);
}
.wrap{ width:min(92vw,760px); display:grid; gap:18px; }

/* Title block (outside glass, left aligned) */
.titleblock{
  margin-top:2vh;
}
.h1{
  margin:0 0 .2rem 0;
  font-family:"ABC Maxi Round", system-ui, sans-serif;
  font-weight:800;
  font-size:clamp(26px,7.2vw,54px);
  letter-spacing:.04em;
  text-transform:uppercase;
}
.tagline{
  margin:.25rem 0 0;
  color:var(--sub);
  font-size:clamp(13px,3.4vw,16px);
  letter-spacing:.08em;
}

/* Glass cards */
.glass{
  backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
  background:var(--glass); border:1px solid var(--stroke); border-radius:24px;
  box-shadow:0 6px 40px rgba(0,0,0,.25);
  padding:clamp(18px,4vw,28px); color:#fff;
}

/* Player */
.player{ display:flex; align-items:center; justify-content:space-between; gap:32px; }
.title{ margin:0; font:600 clamp(18px,4.8vw,30px)/1.15 "ABC Maxi Round", system-ui, sans-serif; }
.sub{ margin:.35rem 0 0; color:var(--sub); font-size:clamp(12px,3.4vw,15px); }
.play{
  display:grid; place-items:center; width:clamp(56px,14vw,84px); aspect-ratio:1/1; border-radius:50%;
  border:1px solid var(--stroke);
  background:linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.04));
  box-shadow:inset 0 0 18px rgba(255,255,255,.06), 0 10px 24px rgba(0,0,0,.45);
  cursor:pointer; transition:.2s; -webkit-tap-highlight-color:transparent;
}
.play:hover{ transform:scale(1.04); border-color:color-mix(in srgb, var(--accent) 50%, white 50%); box-shadow:0 0 32px color-mix(in srgb, var(--accent) 40%, transparent) }
.play svg{ width:40%; height:40% } .play path{ fill:var(--accent) }
audio{ display:none }

/* Tabs */
.glass-tabs{ padding-top:20px; padding-bottom:20px; }
.tabs{ display:flex; flex-wrap:wrap; gap:10px; }
.tab{
  border:1px solid var(--stroke); background:var(--tab);
  color:#ddd; font-size:14px; padding:10px 14px; border-radius:999px; text-decoration:none; transition:.2s;
  font-family:"ABC Maxi Round", system-ui, sans-serif; font-weight:600; letter-spacing:.02em;
}
.tab:hover{ opacity:.85 }
.tab.active{ color:var(--text); border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent) inset }

/* Small */
@media (max-width:560px){
  .player{ gap:18px }
}
</style>
</head>
<body>

<!-- Background -->
<div id="bg" aria-hidden="true"></div>

<!-- App -->
<div class="app">
  <div class="wrap">

    <!-- Headline (no glass) -->
    <header class="titleblock">
      <h1 class="h1">Within<br>the Forest</h1>
      <div class="tagline">Sound • Perception • Emotion</div>
    </header>

    <!-- Player -->
    <div class="glass player">
      <div>
        <h2 class="title" id="title">Forest in Summer</h2>
        <p class="sub">Headphones recommended</p>
      </div>
      <button class="play" id="play" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <!-- Tabs -->
    <div class="glass glass-tabs">
      <nav class="tabs" id="tabs"></nav>
    </div>

    <audio id="aud" preload="auto"></audio>
  </div>
</div>

<script>
/* True viewport height (fixes iOS bars) */
function setAppHeight(){
  const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--appH', Math.round(h) + 'px');
}
function refreshVH(){ setAppHeight(); setTimeout(setAppHeight,80); setTimeout(setAppHeight,300); }
refreshVH();
addEventListener('resize', refreshVH, {passive:true});
addEventListener('orientationchange', refreshVH);

/* Tracks & backgrounds */
const TRACKS = {
  summer:  { file: "Forest in Summer.mp3",       title: "Forest in Summer",             mood:"warm",  bg:"00_Summer Forest.png" },
  rain:    { file: "Forest in the Rain.mp3",     title: "Forest in the Rain",           mood:"rain",  bg:"00_Summer Forest.png" }, // tints + raindrops
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Forest during a Thunderstorm", mood:"storm", bg:"00_Summer Forest.png" }, // tints + lightning
  night:   { file: "Forest at Night.mp3",        title: "Forest at Night",              mood:"cool",  bg:"00_Night_Forest.png" },
  city:    { file: "Cityscape.mp3",              title: "Cityscape",                    mood:"city",  bg:"00_Cityscape.png" }
};

const aud    = document.getElementById('aud');
const btn    = document.getElementById('play');
const icon   = document.getElementById('icon');
const titleEl= document.getElementById('title');
const tabsEl = document.getElementById('tabs');
const bgEl   = document.getElementById('bg');

function setIconPlaying(p){ icon.setAttribute('d', p ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z'); }

/* Rain control */
let rainRunning = false;
function clearRain(){ document.querySelectorAll('.raindrop,.flash').forEach(el=>el.remove()); rainRunning=false; }
function spawnRainBatch(){
  if(!rainRunning) return;
  const drops = innerWidth < 768 ? 22 : 36;
  for(let i=0;i<drops;i++){
    const d=document.createElement('div');
    d.className='raindrop';
    d.style.left=(Math.random()*100)+'vw';
    d.style.height=(24+Math.random()*50)+'px';
    d.style.opacity=(0.05+Math.random()*0.15).toFixed(2);
    d.style.animationDuration=(innerWidth<768?(2.0+Math.random()*1.6):(1.0+Math.random()*1.6))+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2800);
  }
  setTimeout(spawnRainBatch, 1000);
}
/* Lightning pulses */
let stormTimer = null;
function startStormFlashes(){
  stopStormFlashes();
  function flashOnce(){
    const f=document.createElement('div');
    f.className='flash';
    document.body.appendChild(f);
    setTimeout(()=>f.remove(), 900);
  }
  stormTimer = setInterval(()=>{
    if(Math.random()<0.55) flashOnce();
  }, 1800);
}
function stopStormFlashes(){
  if(stormTimer) clearInterval(stormTimer);
  stormTimer = null;
  document.querySelectorAll('.flash').forEach(n=>n.remove());
}

/* Overlay tuning per mood + background image */
function updateLook(key){
  const t = TRACKS[key]; if(!t) return;

  // Background image
  bgEl.style.backgroundImage =
    `${getComputedStyle(document.documentElement).getPropertyValue('--overlay')}, url("${encodeURI(t.bg)}")`;

  // Reset effects
  clearRain(); stopStormFlashes();

  // Color grading per mood
  let overlay = "";
  switch(t.mood){
    case "warm": // Day
      overlay = "linear-gradient(90deg, rgba(80,58,22,0.50) 0%, rgba(90,70,28,0.26) 40%, rgba(70,46,16,0.50) 100%)";
      bgEl.style.filter = "saturate(1.12) contrast(1.02) brightness(1.03)";
      break;
    case "rain":
      overlay = "linear-gradient(90deg, rgba(18,34,18,0.62) 0%, rgba(36,48,36,0.30) 40%, rgba(18,34,18,0.62) 100%)";
      bgEl.style.filter = "saturate(1.05) contrast(1.0) brightness(0.96)";
      rainRunning = true; spawnRainBatch();
      break;
    case "storm":
      overlay = "linear-gradient(90deg, rgba(12,22,40,0.72) 0%, rgba(0,0,0,0.34) 40%, rgba(16,28,46,0.72) 100%)";
      bgEl.style.filter = "saturate(0.98) contrast(1.08) brightness(0.95)";
      startStormFlashes();
      break;
    case "cool": // Night
      overlay = "linear-gradient(90deg, rgba(5,18,34,0.72) 0%, rgba(0,0,0,0.32) 40%, rgba(10,20,36,0.72) 100%)";
      bgEl.style.filter = "saturate(0.98) contrast(1.05) brightness(0.96)";
      break;
    case "city":
      overlay = "linear-gradient(90deg, rgba(6,14,22,0.66) 0%, rgba(0,0,0,0.28) 40%, rgba(10,18,26,0.66) 100%)";
      bgEl.style.filter = "saturate(0.96) contrast(1.06) brightness(0.98)";
      break;
  }
  document.documentElement.style.setProperty('--overlay', overlay);
}

/* Set track */
function setTrack(key, autoplay=false){
  const t = TRACKS[key]; if(!t) return;
  aud.src = encodeURI(t.file);
  titleEl.textContent = t.title;

  [...tabsEl.querySelectorAll('a.tab')].forEach(a => a.classList.toggle('active', a.dataset.key === key));

  setIconPlaying(false);
  updateLook(key);
  refreshVH();

  if(autoplay){
    aud.play().then(()=>{ setIconPlaying(true); refreshVH(); }).catch(()=>{});
  }
}

/* Build tabs */
function buildTabs(activeKey){
  tabsEl.innerHTML = '';
  const order = ["summer","rain","thunder","night","city"];
  order.forEach(key=>{
    const t = TRACKS[key];
    const a=document.createElement('a');
    a.href=`?track=${encodeURIComponent(key)}`;
    a.textContent=t.title;
    a.className='tab'+(key===activeKey?' active':'');
    a.dataset.key=key;
    a.addEventListener('click', e=>{
      e.preventDefault();
      history.replaceState(null,'',`?track=${encodeURIComponent(key)}`);
      setTrack(key, true);
      window.scrollTo(0,0);
    }, {passive:false});
    tabsEl.appendChild(a);
  });
}

/* Start */
const params = new URLSearchParams(location.search);
const startKey = params.get('track') || 'summer';
buildTabs(startKey);
setTrack(startKey, false);

/* Play/Pause */
btn.addEventListener('click', ()=>{
  if(aud.paused){ aud.play().then(()=>{ setIconPlaying(true); refreshVH(); }).catch(()=>{}); }
  else { aud.pause(); setIconPlaying(false); refreshVH(); }
});
aud.addEventListener('pause', ()=>{ setIconPlaying(false); refreshVH(); });
aud.addEventListener('play',  ()=>{ setIconPlaying(true);  refreshVH(); });
</script>
</body>
</html>
