<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Der Wald</title>
<style>
/* ─── SCHRIFTEN ─── */
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Avenir";
  src: url("AvenirLTStd-Book.otf") format("opentype");
  font-weight: 400; font-style: normal;
}

:root {
  --bg-base: #e9e5d3; 
  --text-main: #2d4035;
  --glass-color: rgba(255, 255, 255, 0.45);
  --player-tint: rgba(45, 64, 53, 0.25);
  --accent: #2d4035;
  --status-height: env(safe-area-inset-top, 20px);
}

/* Transitions deaktiviert für sofortiges Farbumspringen */
html, body {
  margin: 0; padding: 0; 
  background-color: var(--bg-base);
  font-family: "Avenir", -apple-system, sans-serif;
  height: auto; width: 100%; 
  overflow-x: hidden;
  transition: none !important; 
}

/* ─── INTRO OVERLAY (Loader) ─── */
#intro-overlay {
  position: fixed; inset: 0; 
  background: #e9e5d3 !important; 
  z-index: 1000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
}
#intro-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.intro-title { 
  font-family: "ABC Maxi Round", sans-serif; 
  font-size: clamp(3.5rem, 12vh, 5.5rem); font-weight: 900; 
  color: #2d4035; margin: 0; 
  letter-spacing: 0.12em;
  transform: rotate(-90deg);
  display: inline-block;
  white-space: nowrap;
  animation: fadeUpRotate 1s ease-out forwards; 
}

.intro-subtitle { 
  font-family: "ABC Maxi Round", sans-serif; font-size: 11px; font-weight: 700; 
  color: #2d4035; 
  margin-top: -5px; /* Deine manuelle Anpassung */
  letter-spacing: 0.3em; text-transform: uppercase; 
  animation: fadeUp 1.2s ease-out 0.4s forwards; 
  opacity: 0;
  z-index: 1010;
}

@keyframes fadeUpRotate { 
  from { opacity: 0; transform: rotate(-90deg) translateY(25px); } 
  to { opacity: 1; transform: rotate(-90deg) translateY(0); } 
}
@keyframes fadeUp { 
  from { opacity: 0; transform: translateY(15px); } 
  to { opacity: 1; transform: translateY(0); } 
}

/* ─── SYSTEM ─── */
.status-bar { position: fixed; top: 0; left: 0; width: 100%; height: var(--status-height); background: #000; z-index: 500; }
#lightning-flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 8; pointer-events: none; }
#rain-container { position: absolute; inset: 0; z-index: 10; pointer-events: none; overflow: hidden; display: none; }
.drop { position: absolute; width: 1px; height: 80px; background: rgba(255,255,255,0.15); bottom: 100%; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(120vh); } }

/* ─── HERO SEKTION (Desktop 520px) ─── */
.hero-container { 
  position: relative; width: 100%; height: 100dvh; 
  display: flex; flex-direction: column; overflow: hidden; margin: 0 auto; z-index: 5; 
}

@media (min-width: 1024px) { 
  .hero-container { 
    max-width: 520px; 
    height: 780px; 
    margin-top: 60px; 
    border-radius: 40px; 
    box-shadow: 0 40px 80px rgba(0,0,0,0.12);
  } 
}

#bg-image { 
  position: absolute; inset: 0; 
  background-position: center center; background-size: cover; z-index: 1;
  image-rendering: -webkit-optimize-contrast;
  transform: scale(1.1); 
}

.top-fade { position: absolute; top: 0; left: 0; right: 0; height: 25dvh; background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 100%); z-index: 15; }
.bottom-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 35dvh; background: linear-gradient(to top, var(--bg-base) 0%, transparent 100%); z-index: 15; }
.bg-overlay { position: absolute; inset: 0; background: url("Background-Texture-web.png") center center / cover repeat; mix-blend-mode: multiply; opacity: 0.3; z-index: 2; }

.hero-content { position: relative; z-index: 100; width: 100%; height: 100%; display: flex; flex-direction: column; padding: calc(var(--status-height) + 20px) 24px 30px; box-sizing: border-box; }

/* ─── TYPOGRAFIE ─── */
.header { text-align: left; position: relative; margin-top: 100px; margin-bottom: 25px; }
.tag { font-family: "ABC Maxi Round", sans-serif; font-size: 12px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; color: var(--text-main); position: relative; z-index: 1
