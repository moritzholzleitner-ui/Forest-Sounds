<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Within the Forest</title>
<style>
/* ===== FONT EMBED ===== */
@font-face{
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype-variations");
  font-weight: 300 900;
  font-style: normal;
  font-display: swap;
}

:root{
  --overlay: linear-gradient(90deg, rgba(5,20,40,0.70) 0%, rgba(0,0,0,0.30) 40%, rgba(10,30,50,0.70) 100%);
  --text: rgba(255,255,255,.96);
  --sub: rgba(255,255,255,.65);
  --glass: rgba(255,255,255,.05);    /* matter */
  --stroke: rgba(255,255,255,.16);
  --accent:#a7c48c;
  --tab:#2a2a2a;
  --appH: 100vh; /* wird per JS gesetzt */
}

/* Basis */
html, body{
  margin:0; padding:0; background:#000; color:var(--text);
  -webkit-text-size-adjust:100%; overflow:hidden; overscroll-behavior:none;
  font-family:"ABC Maxi Round",-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,Helvetica,Arial,sans-serif;
}

/* Hintergrund (Bild + Overlay) */
#bg{
  position:fixed; inset:0; width:100%; height:var(--appH); z-index:0;
  background:
    var(--overlay),
    url("00_Summer Forest.jpeg") center center / cover no-repeat;
  filter:saturate(1.05);
  transition: background .6s ease, height .2s ease, filter .4s ease;
}

/* Regen */
.raindrop{
  position:fixed; top:-12vh; width:1.6px; height:36px;
  background:rgba(255,255,255,0.12); border-radius:2px;
  animation:fall linear forwards; z-index:0; pointer-events:none;
}
@keyframes fall{ to{ transform:translateY(112vh); opacity:0 } }
@media (max-width:768px){ .raindrop{ animation-duration:2.4s !important; } }

/* Blitz (Thunderstorm) */
#lightning{
  position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, rgba(255,255,255,0.85), rgba(255,255,255,0.0) 60%);
  opacity:0; pointer-events:none; z-index:0;
}
.flash{ animation:flash 0.9s ease-out; }
@keyframes flash{
  0%{opacity:0}
  10%{opacity:.9}
  30%{opacity:.15}
  40%{opacity:.55}
  55%{opacity:.06}
  100%{opacity:0}
}

/* Freistehende Headline */
.header-free{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 24px);
  transform:translateX(-50%); text-align:center; z-index:2;
  padding:0 16px;
}
.h1{
  margin:0; text-transform:uppercase; letter-spacing:.04em; font-weight:700;
  font-size:clamp(22px,6.6vw,44px);
  text-shadow:0 2px 18px rgba(0,0,0,.35); /* trennt ohne Box */
}
.tagline{
  margin:.35rem 0 0; color:var(--sub); font-size:clamp(12px,3.2vw,14px); letter-spacing:.06em;
  text-shadow:0 1px 12px rgba(0,0,0,.35);
}

/* App-Layer */
.app{
  position:relative; z-index:1;
  min-height:var(--appH);
  display:flex; align-items:flex-end; justify-content:center;
  padding:calc(env(safe-area-inset-top)+16px) 16px calc(env(safe-area-inset-bottom)+16px);
}
.wrap{ width:min(92vw,760px); display:grid; gap:18px; margin-bottom:8vh; }

/* Glas-Karten */
.glass{
  backdrop-filter:blur(18px) saturate(130%); -webkit-backdrop-filter:blur(18px) saturate(130%);
  background:var(--glass); border:1px solid var(--stroke); border-radius:22px;
  box-shadow:0 6px 36px rgba(0,0,0,.25);
  padding:clamp(18px,4vw,28px); color:#fff;
}

/* Player */
.player{ display:flex; align-items:center; justify-content:space-between; gap:32px; }
.title{ margin:0; font-weight:700; font-size:clamp(18px,4.6vw,28px); line-height:1.15; }
.sub{ margin:.35rem 0 0; color:var(--sub); font-size:clamp(12px,3.4vw,15px); }
.play{
  display:grid; place-items:center; width:clamp(56px,14vw,84px); aspect-ratio:1/1; border-radius:50%;
  border:1px solid var(--stroke);
  background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
  box-shadow:inset 0 0 18px rgba(255,255,255,.05), 0 10px 24px rgba(0,0,0,.45);
  cursor:pointer; transition:.2s; -webkit-tap-highlight-color:transparent;
}
.play:hover{ transform:scale(1.04); border-color:color-mix(in srgb, var(--accent) 50%, white 50%); box-shadow:0 0 32px color-mix(in srgb, var(--accent) 40%, transparent) }
.play svg{ width:40%; height:40% } .play path{ fill:var(--accent) }
audio{ display:none }

/* Tabs */
.tabs{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
.tab{
  border:1px solid var(--stroke); background:var(--tab);
  color:#ddd; font-size:14px; padding:8px 12px; border-radius:999px; text-decoration:none; transition:.2s;
}
.tab:hover{ opacity:.85 }
.tab.active{ color:var(--text); border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent) inset }
</style>
</head>
<body>

<!-- Hintergrund -->
<div id="bg" aria-hidden="true"></div>
<div id="lightning" aria-hidden="true"></div>

<!-- Freistehende Headline -->
<header class="header-free">
  <h1 class="h1">WITHIN <span class="dim">THE FOREST</span></h1>
  <div class="tagline">Sound · Perception · Emotion</div>
</header>

<!-- App -->
<div class="app">
  <div class="wrap">

    <div class="glass player">
      <div>
        <h2 class="title" id="title">Forest in Summer</h2>
        <p class="sub">Headphones recommended</p>
      </div>
      <button class="play" id="play" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24"><path id="icon" d="M8 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="glass">
      <nav class="tabs" id="tabs"></nav>
    </div>

    <audio id="aud" preload="auto"></audio>
  </div>
</div>

<script>
/* echte Fensterhöhe → keine Balken auf iPhone */
function setAppHeight(){
  const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--appH', Math.round(h) + 'px');
}
function refreshVH(){ setAppHeight(); setTimeout(setAppHeight,80); setTimeout(setAppHeight,300); }
refreshVH();
addEventListener('resize', refreshVH, {passive:true});
addEventListener('orientationchange', refreshVH);

/* ===== Config ===== */
const IMAGES = {
  summer: "00_Summer Forest.jpeg",
  rain:   "00_Summer Forest.jpeg",       // gleicher Hintergrund, anderes Overlay
  thunder:"00_Summer Forest.jpeg",       // gleicher Hintergrund, Blitz
  night:  "00_Night_Forest.jpeg",
  city:   "00_Cityscape.png"
};

const TRACKS = {
  summer:  { file: "Forest at Summer.mp3",           title: "Forest in Summer",                mood:"warm",    key:"summer"  },
  rain:    { file: "Forest in the Rain.mp3",         title: "Forest in the Rain",              mood:"rain",    key:"rain"    },
  thunder: { file: "Forest at Thunderstorm.mp3",     title: "Forest during a Thunderstorm",    mood:"thunder", key:"thunder" },
  night:   { file: "Forest at Night.mp3",            title: "Forest at Night",                 mood:"cool",    key:"night"   },
  city:    { file: "Cityscape.mp3",                  title: "Cityscape",                       mood:"city",    key:"city"    }
};

const aud    = document.getElementById('aud');
const btn    = document.getElementById('play');
const icon   = document.getElementById('icon');
const titleEl= document.getElementById('title');
const tabsEl = document.getElementById('tabs');
const bgEl   = document.getElementById('bg');
const flashEl= document.getElementById('lightning');

function setIconPlaying(p){ icon.setAttribute('d', p ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z'); }

/* Regen */
let rainRunning = false;
function clearRain(){ document.querySelectorAll('.raindrop').forEach(el=>el.remove()); rainRunning=false; }
function spawnRainBatch(){
  if(!rainRunning) return;
  const drops = innerWidth < 768 ? 22 : 36;
  for(let i=0;i<drops;i++){
    const d=document.createElement('div');
    d.className='raindrop';
    d.style.left=(Math.random()*100)+'vw';
    d.style.height=(24+Math.random()*50)+'px';
    d.style.opacity=(0.05+Math.random()*0.15).toFixed(2);
    d.style.animationDuration=(innerWidth<768?(2.0+Math.random()*1.6):(1.0+Math.random()*1.6))+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2800);
  }
  setTimeout(spawnRainBatch, 1000);
}

/* Blitz */
let thunderTimer = null;
function startThunder(){
  stopThunder();
  function flash(){
    flashEl.classList.remove('flash'); void flashEl.offsetWidth; flashEl.classList.add('flash');
    // nächster Blitz unregelmäßig
    const next = 1200 + Math.random()*2600;
    thunderTimer = setTimeout(flash, next);
  }
  thunderTimer = setTimeout(flash, 800);
}
function stopThunder(){
  if(thunderTimer){ clearTimeout(thunderTimer); thunderTimer=null; }
  flashEl.classList.remove('flash');
}

/* Overlay- & Bildwechsel */
function setBackgroundImage(src){
  bgEl.style.backgroundImage = `var(--overlay), url("${src}")`;
}
function updateOverlay(mood){
  clearRain(); stopThunder();

  let overlay = "linear-gradient(90deg, rgba(5,20,40,0.70) 0%, rgba(0,0,0,0.30) 40%, rgba(10,30,50,0.70) 100%)";
  bgEl.style.filter = "saturate(1.05)";

  if(mood === "warm"){                 // Summer
    overlay = "linear-gradient(90deg, rgba(60,40,10,0.50) 0%, rgba(80,60,20,0.25) 40%, rgba(60,30,0,0.50) 100%)";
    bgEl.style.filter = "saturate(1.12) contrast(1.02) brightness(1.03)";
  } else if(mood === "rain"){          // Rain
    overlay = "linear-gradient(90deg, rgba(18,34,18,0.62) 0%, rgba(36,48,36,0.30) 40%, rgba(18,34,18,0.62) 100%)";
    bgEl.style.filter = "saturate(1.05) contrast(1.0) brightness(0.96)";
    rainRunning = true; spawnRainBatch();
  } else if(mood === "thunder"){       // Thunderstorm (dunkler, kühler + Blitze)
    overlay = "linear-gradient(90deg, rgba(6,10,18,0.78) 0%, rgba(8,10,14,0.38) 40%, rgba(6,10,18,0.78) 100%)";
    bgEl.style.filter = "saturate(0.98) contrast(1.08) brightness(0.92)";
    startThunder();
  } else if(mood === "city"){          // City: neutral-kühl
    overlay = "linear-gradient(90deg, rgba(18,22,28,0.62) 0%, rgba(8,10,12,0.28) 40%, rgba(18,22,28,0.62) 100%)";
    bgEl.style.filter = "saturate(0.98) contrast(1.04) brightness(0.98)";
  } else {                             // Night (cool)
    overlay = "linear-gradient(90deg, rgba(5,20,40,0.70) 0%, rgba(0,0,0,0.30) 40%, rgba(10,30,50,0.70) 100%)";
    bgEl.style.filter = "saturate(1.00) contrast(1.05) brightness(0.96)";
  }

  document.documentElement.style.setProperty('--overlay', overlay);
}

/* Track + Hintergrund setzen */
function setScene(key, autoplay=false){
  const t = TRACKS[key]; if(!t) return;

  // Hintergrundbild je Szene
  const img = IMAGES[key] || IMAGES.summer;
  setBackgroundImage(img);

  // Audio
  aud.src = encodeURI(t.file);
  titleEl.textContent = t.title;

  // Tabs
  [...tabsEl.querySelectorAll('a.tab')].forEach(a => a.classList.toggle('active', a.dataset.key === key));

  // Visuals
  setIconPlaying(false);
  updateOverlay(t.mood);
  refreshVH();

  if(autoplay){
    aud.play().then(()=>{ setIconPlaying(true); refreshVH(); }).catch(()=>{});
  }
}

/* Tabs rendern */
function buildTabs(activeKey){
  tabsEl.innerHTML = '';
  const order = ["summer","rain","thunder","night","city"];
  order.forEach(key=>{
    const t = TRACKS[key];
    const a=document.createElement('a');
    a.href=`?scene=${encodeURIComponent(key)}`;
    a.textContent=t.title;
    a.className='tab'+(key===activeKey?' active':'');
    a.dataset.key=key;
    a.addEventListener('click', e=>{
      e.preventDefault();
      history.replaceState(null,'',`?scene=${encodeURIComponent(key)}`);
      setScene(key, true);
      window.scrollTo(0,0);
    }, {passive:false});
    tabsEl.appendChild(a);
  });
}

/* Start */
const params = new URLSearchParams(location.search);
const startKey = params.get('scene') || 'summer';
buildTabs(startKey);
setScene(startKey, false);

/* Play/Pause */
btn.addEventListener('click', ()=>{
  if(aud.paused){ aud.play().then(()=>{ setIconPlaying(true); refreshVH(); }).catch(()=>{}); }
  else { aud.pause(); setIconPlaying(false); refreshVH(); }
});
aud.addEventListener('pause', ()=>{ setIconPlaying(false); refreshVH(); });
aud.addEventListener('play',  ()=>{ setIconPlaying(true);  refreshVH(); });
</script>
</body>
</html>
