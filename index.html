<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Within the Forest</title>
<style>
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --appH: 100vh;
  --bg-base: #e9e5d3; 
  --text-main: #2d4035;
  --glass-color: rgba(255, 255, 255, 0.45);
  --player-tint: rgba(60, 82, 69, 0.82);
  /* Neue Farbe für den Fortschrittsbalken (ein leuchtendes Cyan-Blau) */
  --progress-blue: #00e0ff;
}

html, body {
  margin: 0; padding: 0; background: var(--bg-base);
  font-family: "ABC Maxi Round", sans-serif;
  overflow: hidden; height: var(--appH);
  display: flex; justify-content: center;
  transition: background-color 0.8s ease-in-out;
}

#stage-container {
  position: fixed; width: 100%; max-width: 100vh; height: var(--appH);
  z-index: 0; overflow: hidden; background: var(--bg-base);
}

#bg-image {
  position: absolute; inset: 0; background-position: center center;
  background-size: cover; transition: background-image 0.8s ease;
}

.fade-overlay {
  position: absolute; inset: -1px; z-index: 1; pointer-events: none;
  background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 18%, transparent 82%, var(--bg-base) 100%);
  transition: background 0.8s ease;
}

#bg-texture {
  position: absolute; inset: 0; z-index: 2;
  background: url("Background-Texture-web.png") center center / cover repeat;
  mix-blend-mode: multiply; opacity: 0.4; pointer-events: none;
}

.app { 
  position: relative; z-index: 10; width: 100%; max-width: 100vh; 
  height: var(--appH); display: flex; flex-direction: column;
}

.content-wrap {
  height: 100%; display: flex; flex-direction: column;
  padding: calc(env(safe-area-inset-top) + 75px) 24px calc(env(safe-area-inset-bottom) + 85px);
  box-sizing: border-box;
}

.header { text-align: left; position: relative; margin-bottom: 15px; }
.tag { font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 700; color: var(--text-main); }
.h1 { font-size: 50px; margin: 0; line-height: 0.9; font-weight: 900; color: var(--text-main); }
.header-rings { position: absolute; top: 0; right: -10px; width: 130px; height: auto; opacity: 0.8; pointer-events: none; }

.tabs-float { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 10px; margin-top: auto; margin-bottom: 40px; }
.tab {
  border: none; background: var(--glass-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text-main); padding: 10px 18px; border-radius: 40px;
  text-decoration: none; font-size: 15px; font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: all 0.3s ease;
}
.tab.active { background: var(--text-main); color: #fff; transform: scale(0.97); }

/* ─── Player Card Styles ─── */
.player-card {
  width: 100%; position: relative;
  background: var(--player-tint); backdrop-filter: blur(25px) saturate(160%); -webkit-backdrop-filter: blur(25px) saturate(160%);
  border-radius: 35px; 
  /* Padding unten etwas reduziert, damit der Balken gut aussieht */
  padding: 28px 28px 32px 28px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; box-shadow: 0 22px 45px rgba(0,0,0,0.2);
  box-sizing: border-box; overflow: hidden; /* Wichtig damit der Balken nicht übersteht */
}

.player-rings-bg {
  position: absolute; inset: 0; background: url("Baumstamm_freigestellt_beige.png") center center / cover no-repeat;
  opacity: 0.12; mix-blend-mode: overlay; pointer-events: none; z-index: 1;
}

/* Z-Index erhöht, damit Text über dem Balken-Hintergrund liegt */
.player-info { position: relative; z-index: 5; }
.player-info h2 { margin: 0; font-size: 24px; font-weight: 800; }
.player-info p { margin: 4px 0 0; font-size: 14px; opacity: 0.8; }
.time-label { display: inline-block; margin-top: 12px; font-size: 15px; font-family: "ABC Maxi Round", sans-serif; }

/* Z-Index erhöht */
.play-btn {
  position: relative; z-index: 5;
  width: 70px; height: 70px; border-radius: 50%; border: none;
  background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.play-btn svg { width: 32px; height: 32px; fill: #3c5245; }

/* ─── Neuer Fortschrittsbalken (Progress Bar) ─── */
.progress-container {
  position: absolute;
  bottom: 0; left: 0; width: 100%; height: 5px; /* Höhe des Balkens */
  background: rgba(255, 255, 255, 0.15); /* Leichter Hintergrund für den inaktiven Teil */
  z-index: 2; cursor: pointer; /* Klickbar machen */
}
.progress-bar {
  height: 100%; width: 0%; /* Startet bei 0% */
  background: var(--progress-blue); /* Das leuchtende Blau */
  box-shadow: 0 0 10px var(--progress-blue); /* Leichter Glow-Effekt */
  transition: width 0.1s linear; /* Weiche Bewegung */
}

@media (orientation: landscape) and (max-height: 500px) {
  body::after { content: "Bitte verwende das Hochformat"; position: fixed; inset: 0; background: var(--bg-base); z-index: 1000; display: flex; align-items: center; justify-content: center; font-weight: 900; }
}
</style>
</head>
<body>

<div id="stage-container">
  <div id="bg-image"></div>
  <div class="fade-overlay"></div>
  <div id="bg-texture"></div>
</div>

<div class="app">
  <div class="content-wrap">
    
    <header class="header">
      <div class="tag">Sound · Perception · Emotion</div>
      <h1 class="h1">DER WALD</h1>
      <img src="brett-aquarell-ahorngruen.png" class="header-rings" alt="">
    </header>

    <div class="tabs-float" id="tabs"></div>

    <section class="player-card">
      <div class="player-rings-bg"></div>
      <div class="player-info">
        <h2 id="track-title">Wald im Sommer</h2>
        <p>Kopfhörer empfohlen</p>
        <span class="time-label" id="track-duration">0:00 / --:--</span>
      </div>
      <button class="play-btn" id="play-trigger">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </section>

  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script>
const TRACK_DATA = {
  summer:  { file: "Forest at Summer.mp3", title: "Wald im Sommer", bg: "00_Summer Forest.png", theme: "light" },
  winter:  { file: "Forest at Night.mp3", title: "Winter Wald", bg: "00_Night_Forest.png", theme: "dark" },
  spring:  { file: "Forest in the Rain.mp3", title: "Frühlings Wald", bg: "Forest-Background_2.png", theme: "light" },
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Wald bei Gewitter", bg: "Forest-Background-Japan.PNG", theme: "dark" },
  autumn:  { file: "Forest at Summer.mp3", title: "Herbst Wald", bg: "00_Summer Forest.png", theme: "light" },
  night:   { file: "Forest at Night.mp3", title: "Nacht Wald", bg: "00_Night_Forest.png", theme: "dark" },
  rain:    { file: "Forest in the Rain.mp3", title: "Wald bei Regen", bg: "00_Summer Forest.png", theme: "light" },
  city:    { file: "Cityscape.mp3", title: "Der Baum in der Stadt", bg: "00_Cityscape.png", theme: "dark" }
};

const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-trigger');
const playIcon = document.getElementById('play-icon');
const bgImage = document.getElementById('bg-image');
const timeLabel = document.getElementById('track-duration');
const tabsContainer = document.getElementById('tabs');
// Neue Referenzen für den Balken
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-container');

// Hilfsfunktion für Zeitformat (mm:ss)
function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateUI(key) {
  const track = TRACK_DATA[key];
  document.getElementById('track-title').textContent = track.title;
  bgImage.style.backgroundImage = `url("${encodeURI(track.bg)}")`;

  const isDark = track.theme === "dark";
  document.documentElement.style.setProperty('--bg-base', isDark ? "#1a1c1a" : "#e9e5d3");
  document.documentElement.style.setProperty('--text-main', isDark ? "#e9e5d3" : "#2d4035");
  document.documentElement.style.setProperty('--glass-color', isDark ? "rgba(255, 255, 255, 0.15)" : "rgba(255, 255, 255, 0.45)");
  
  // Reset Balken und Zeit beim Trackwechsel
  progressBar.style.width = "0%";
  timeLabel.textContent = "0:00 / " + (audio.duration ? formatTime(audio.duration) : "--:--");
  
  renderTabs(key);
}

function renderTabs(activeKey) {
  tabsContainer.innerHTML = '';
  const order = ['summer', 'winter', 'spring', 'thunder', 'autumn', 'night', 'rain', 'city'];
  order.forEach(key => {
    const btn = document.createElement('a');
    btn.href = "#";
    btn.className = 'tab' + (key === activeKey ? ' active' : '');
    btn.textContent = TRACK_DATA[key].title;
    btn.onclick = (e) => {
      e.preventDefault();
      if (activeKey === key) return;
      audio.src = TRACK_DATA[key].file;
      updateUI(key);
      audio.play();
      playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
    };
    tabsContainer.appendChild(btn);
  });
}

// Event: Metadaten geladen (Gesamtzeit anzeigen)
audio.onloadedmetadata = () => {
   timeLabel.textContent = "0:00 / " + formatTime(audio.duration);
};

// Event: Während des Abspielens (Balken und Zeit aktualisieren)
audio.ontimeupdate = () => {
  if (audio.duration) {
    // Prozent berechnen für Balkenbreite
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${percent}%`;
    // Text aktualisieren: Aktuell / Gesamt
    timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }
};

// Event: Klick auf den Balken (Spulen/Seeking)
progressContainer.onclick = (e) => {
  const rect = progressContainer.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const width = rect.width;
  const percentage = clickX / width;
  audio.currentTime = percentage * audio.duration;
};

playBtn.onclick = () => {
  if(audio.paused) {
    audio.play();
    playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
  } else {
    audio.pause();
    playIcon.setAttribute('d', 'M8 5v14l11-7z');
  }
};

// Initialisierung
updateUI('summer');
audio.src = TRACK_DATA.summer.file;
</script>

</body>
</html>
