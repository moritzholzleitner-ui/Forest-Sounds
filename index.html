<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta id="theme-meta" name="theme-color" content="#e9e5d3" />
<title>Der Wald</title>
<style>
@font-face {
  font-family: "ABC Maxi Round";
  src: url("ABCMaxiRoundVariable-Trial.ttf") format("truetype");
  font-weight: 100 900; font-style: normal; font-display: swap;
}

:root {
  --bg-base: #e9e5d3; 
  --text-main: #2d4035;
  --glass-color: rgba(255, 255, 255, 0.45);
  --player-tint: rgba(45, 64, 53, 0.25); 
  --accent: #2d4035;
}

/* ─── Immersiver Scroll-Fluss ─── */
html, body {
  margin: 0; padding: 0; 
  background: var(--bg-base);
  font-family: "ABC Maxi Round", sans-serif;
  height: 100%; width: 100%;
  overflow-x: hidden;
  overflow-y: auto; /* Aktiviert das Scrollen für Safari-UI-Trigger */
  -webkit-overflow-scrolling: touch;
  transition: background-color 0.8s ease;
}

/* ─── Hintergrund-System (Mit-scrollend aber flächendeckend) ─── */
#stage-container {
  position: absolute; 
  top: 0; left: 0; width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

#bg-image {
  position: absolute; inset: 0;
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
  transition: background-image 0.8s ease;
}

#bg-texture {
  position: absolute; inset: 0; z-index: 2;
  background: url("Background-Texture-web.png") center center / cover repeat;
  mix-blend-mode: multiply; opacity: 0.35;
}

/* ─── UI Layout (Scroll-Inhalt) ─── */
.app { 
  position: relative; z-index: 10; width: 100%; 
  min-height: 101vh; /* Erzwingt minimalen Scrollweg für Fullscreen-Modus */
  display: flex; flex-direction: column; align-items: center;
}

.content-wrap {
  width: 100%; min-height: 100vh;
  display: flex; flex-direction: column;
  /* Headline-Positionierung für Überlappung */
  padding: calc(env(safe-area-inset-top) + 105px) 24px calc(env(safe-area-inset-bottom) + 120px);
  box-sizing: border-box;
}

@media (min-width: 768px) { .content-wrap { max-width: 500px; } }

/* ─── Header: Baseline auf Ring-Mitte ─── */
.header { text-align: left; position: relative; margin-bottom: 30px; }
.tag { 
  font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; 
  font-weight: 700; color: var(--text-main); position: relative; z-index: 10;
}
.h1 { 
  font-size: 48px; margin: 0; line-height: 0.9; font-weight: 900; 
  color: var(--text-main); position: relative; z-index: 10;
}

.header-rings {
  position: absolute; 
  top: -24px; /* Perfekte Baseline-Ausrichtung */
  left: 60px; 
  width: 440px; height: auto;
  opacity: 0.8; z-index: 5; pointer-events: none;
}

/* ─── Schwebende Buttons (Outline-Logic) ─── */
.tabs-float {
  display: flex; flex-wrap: wrap; justify-content: flex-start;
  gap: 10px; margin-top: auto; margin-bottom: 40px;
}
.tab {
  border: 1.5px solid transparent; 
  background: var(--glass-color);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: var(--text-main);
  padding: 10px 18px; border-radius: 40px;
  text-decoration: none; font-size: 15px; font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  transition: all 0.3s ease;
}
.tab.active { 
  background: rgba(255, 255, 255, 0.1); 
  border-color: var(--accent); 
  color: var(--accent);
  transform: scale(0.97); 
}

/* ─── Player Card ─── */
.player-card {
  width: 100%; position: relative;
  background: var(--player-tint);
  backdrop-filter: blur(25px) saturate(160%); -webkit-backdrop-filter: blur(25px);
  border-radius: 35px; padding: 28px;
  display: flex; align-items: center; justify-content: space-between;
  color: #fff; box-shadow: 0 22px 45px rgba(0,0,0,0.25);
  box-sizing: border-box; overflow: hidden;
}

.player-info { position: relative; z-index: 5; }
.player-info h2 { margin: 0; font-size: 24px; font-weight: 800; }
.player-info p { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }
.time-label { display: inline-block; margin-top: 12px; font-size: 15px; font-family: "ABC Maxi Round", sans-serif; }

.play-btn {
  position: relative; z-index: 5;
  width: 70px; height: 70px; border-radius: 50%; border: none;
  background: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.play-btn svg { width: 32px; height: 32px; fill: #2d4035; }

/* ─── Progress Bar ─── */
.progress-container {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 6px;
  background: rgba(255, 255, 255, 0.15); z-index: 10; cursor: pointer;
}
.progress-bar {
  height: 100%; width: 0%; 
  background: var(--accent);
  transition: width 0.1s linear;
}
</style>
</head>
<body>

<div id="stage-container">
  <div id="bg-image"></div>
  <div id="bg-texture"></div>
</div>

<div class="app">
  <div class="content-wrap">
    
    <header class="header">
      <div class="tag">Klang · Wahrnehmung · Emotion</div>
      <h1 class="h1">DER WALD</h1>
      <img src="brett-aquarell-freigestellt.png" class="header-rings" alt="">
    </header>

    <div class="tabs-float" id="tabs"></div>

    <section class="player-card">
      <div class="player-info">
        <h2 id="track-title">Sommer</h2>
        <p>Kopfhörer empfohlen</p>
        <span class="time-label" id="track-duration">0:00 / --:--</span>
      </div>
      <button class="play-btn" id="play-trigger">
        <svg viewBox="0 0 24 24"><path id="play-icon" d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </section>

  </div>
</div>

<audio id="audio-player" preload="metadata"></audio>

<script>
const TRACK_DATA = {
  summer:  { file: "Forest at Summer.mp3", title: "Sommer", bg: "03_Sommer.png", theme: "#e9e5d3", text: "#2d4035", isDark: false },
  winter:  { file: "Forest at Night.mp3", title: "Winter", bg: "01_Winter.png", theme: "#ffffff", text: "#2d4035", isDark: false },
  spring:  { file: "Forest in the Rain.mp3", title: "Frühling", bg: "02_Fruehling.png", theme: "#e9e5d3", text: "#2d4035", isDark: false },
  autumn:  { file: "Forest at Summer.mp3", title: "Herbst", bg: "04_Herbst.jpg", theme: "#2b2b2b", text: "#ffffff", isDark: true },
  night:   { file: "Forest at Night.mp3", title: "Nacht", bg: "00_Nacht.png", theme: "#0a0c1a", text: "#ffffff", isDark: true },
  rain:    { file: "Forest in the Rain.mp3", title: "Bei Regen", bg: "00_Regen.png", theme: "#2b2b2b", text: "#ffffff", isDark: true },
  thunder: { file: "Forest at Thunderstorm.mp3", title: "Bei Gewitter", bg: "00_Gewitter.png", theme: "#0a0c1a", text: "#ffffff", isDark: true },
  city:    { file: "Cityscape.mp3", title: "In der Stadt", bg: "05_Urbanitaet.png", theme: "#1a1a1a", text: "#ffffff", isDark: true }
};

const audio = document.getElementById('audio-player');
const playBtn = document.getElementById('play-trigger');
const playIcon = document.getElementById('play-icon');
const bgImage = document.getElementById('bg-image');
const timeLabel = document.getElementById('track-duration');
const tabsContainer = document.getElementById('tabs');
const progressBar = document.getElementById('progress-bar');
const progressContainer = document.getElementById('progress-container');
const themeMeta = document.getElementById('theme-meta');

function formatTime(seconds) {
  if (isNaN(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function updateUI(key) {
  const track = TRACK_DATA[key];
  document.getElementById('track-title').textContent = track.title;
  bgImage.style.backgroundImage = `url("${encodeURI(track.bg)}")`;

  const accentColor = track.isDark ? "#ffffff" : "#2d4035";
  const glassColor = track.isDark ? "rgba(255, 255, 255, 0.15)" : "rgba(255, 255, 255, 0.45)";

  document.documentElement.style.setProperty('--bg-base', track.theme);
  document.documentElement.style.setProperty('--text-main', track.text);
  document.documentElement.style.setProperty('--accent', accentColor);
  document.documentElement.style.setProperty('--glass-color', glassColor);
  
  themeMeta.setAttribute('content', track.theme);

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title,
      artist: 'Der Wald',
      artwork: [{ src: encodeURI(track.bg), sizes: '512x512', type: 'image/png' }]
    });
  }

  renderTabs(key);
}

function renderTabs(activeKey) {
  tabsContainer.innerHTML = '';
  const order = ['summer', 'winter', 'spring', 'autumn', 'night', 'rain', 'thunder', 'city'];
  order.forEach(key => {
    const btn = document.createElement('a');
    btn.href = "#";
    btn.className = 'tab' + (key === activeKey ? ' active' : '');
    btn.textContent = TRACK_DATA[key].title;
    btn.onclick = (e) => {
      e.preventDefault();
      audio.src = TRACK_DATA[key].file;
      updateUI(key);
      audio.play();
      playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
    };
    tabsContainer.appendChild(btn);
  });
}

audio.onloadedmetadata = () => {
   timeLabel.textContent = "0:00 / " + formatTime(audio.duration);
};

audio.ontimeupdate = () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = `${percent}%`;
    timeLabel.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }
};

progressContainer.onclick = (e) => {
  const rect = progressContainer.getBoundingClientRect();
  const percentage = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percentage * audio.duration;
};

playBtn.onclick = () => {
  if(audio.paused) {
    audio.play();
    playIcon.setAttribute('d', 'M6 5h4v14H6zm8 0h4v14h-4z');
  } else {
    audio.pause();
    playIcon.setAttribute('d', 'M8 5v14l11-7z');
  }
};

updateUI('summer');
audio.src = TRACK_DATA.summer.file;
</script>

</body>
</html>
